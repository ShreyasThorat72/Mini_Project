<!DOCTYPE html>
<html>
<head>
    <title>CyberShield AI</title>

    <style>
        body {
            background: #050816;
            font-family: Arial;
            color: white;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: #0b0f2a;
            border-radius: 20px;
        }

        h1 {
            color: #00f5ff;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 20px;
            background: linear-gradient(90deg, #7f00ff, #00f5ff);
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            color: #00f5ff;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>CyberShield AI</h1>
    <p>Neural Threat Detection</p>

    <form action="/predict" method="post">

        <input type="number" step="any" name="duration" placeholder="Duration (ms)">

        <select name="protocol_type">
            <option value="TCP">TCP</option>
            <option value="UDP">UDP</option>
            <option value="ICMP">ICMP</option>
        </select>

        <input type="number" step="any" name="src_bytes" placeholder="Source Bytes">
        <input type="number" step="any" name="dst_bytes" placeholder="Destination Bytes">

        <input type="number" step="any" name="count" placeholder="Count">
        <input type="number" step="any" name="failed_logins" placeholder="Failed Logins">

        <button type="submit">INITIALIZE SCAN</button>

    </form>

    {% if prediction %}
        <div class="result">
            {{prediction}}
        </div>
    {% endif %}

</div>

</body>
</html>
